[project]
name = "backdrop-telegram"
version = "0.1.0"
description = "Worker Telegram de Backdrop: session MTProto unique, activités Temporal."
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9",
    "hydrogram>=0.1.4",
    "tgcrypto>=1.2.5",
    "cryptography>=44",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backdrop_telegram"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Le paquet est à la racine du dossier: pas besoin de l'installer pour tester.
pythonpath = ["."]
