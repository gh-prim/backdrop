[project]
name = "backdrop-telegram"
version = "0.1.0"
description = "Worker Telegram de Backdrop: session MTProto unique, activités Temporal."
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9",
    # TDLib et non un client MTProto tiers: Telegram refuse en silence les
    # logins des clients restés sur une couche ancienne (4.2.2).
    "aiotdlib>=0.27.6",
    "cryptography>=44",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Sonde ponctuelle du média payant, lancée à la main depuis l'hôte. Hors de
# l'image: le worker ne l'importe pas.
probe = ["hydrogram>=0.1.4", "tgcrypto>=1.2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backdrop_telegram"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Le paquet est à la racine du dossier: pas besoin de l'installer pour tester.
pythonpath = ["."]
