# Construction des images sur GitHub, pas sur le serveur.
#
# Le serveur a 4 cœurs et **3 Go de mémoire**. Un `next build` et deux
# installations pnpm complètes y tenaient en une vingtaine de minutes, la
# machine passant l'essentiel du temps à s'échanger de la mémoire — pendant
# lesquelles l'application, elle, continuait de servir. Déporter la
# construction ramène le déploiement à un téléchargement.
#
# Les quatre images partent en parallèle. `migrate` et `worker-node` viennent
# du même Dockerfile et partagent leurs couches: leur pousser séparément ne
# duplique rien dans le registre.

name: images

on:
  push:
    branches: [main]
  # Reconstruire sans commit, quand un déploiement a échoué pour une raison
  # étrangère au code.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Une image qui échoue ne doit pas annuler les trois autres: on veut
      # savoir si le problème est isolé ou général.
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: Dockerfile.web
            target: runtime
          - name: migrate
            context: .
            file: Dockerfile.worker
            target: migrate
          - name: worker-node
            context: .
            file: Dockerfile.worker
            target: worker
          - name: worker-telegram
            context: ./worker-telegram
            file: ./worker-telegram/Dockerfile
            target: ""

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # `latest` pour le déploiement courant, le SHA pour pouvoir revenir
          # en arrière sans reconstruire.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          # Cache partagé entre exécutions: sans lui chaque construction
          # repartirait de l'installation des paquets.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
