# Backdrop — stack de développement.
# Phase 0: base applicative, base Temporal, serveur Temporal, console.
# Les workers (worker-node, worker-telegram) et le service web arrivent en phase 1 et 2.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backdrop}
      POSTGRES_DB: ${POSTGRES_DB:-backdrop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backdrop} -d ${POSTGRES_DB:-backdrop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base Temporal, strictement séparée du schéma applicatif (7.1).
  postgres-temporal:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - postgres-temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # auto-setup applique les migrations de schéma Temporal au démarrage.
  # Acceptable en développement uniquement (7.1). Pour un déploiement durable,
  # basculer sur temporalio/server + temporalio/admin-tools et piloter
  # `temporal-sql-tool` explicitement.
  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      postgres-temporal:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgres-temporal
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "list", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.53.3
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8233}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  # Stockage objet local, interface S3 identique à R2 (section 5).
  # Sert à exercer la chaîne complète sans compte Cloudflare. En production,
  # ce service n'existe pas: R2_ENDPOINT reste vide et l'adapter vise R2.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["dev"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-backdropdev}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-backdropdev-secret}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker-node:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-backdrop}:${POSTGRES_PASSWORD:-backdrop}@postgres:5432/${POSTGRES_DB:-backdrop}?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY}
      MEDIA_ROOT: /media
      SCHEDULE_TOLERANCE_MINUTES: ${SCHEDULE_TOLERANCE_MINUTES:-45}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT_INTERNAL:-}
      META_GRAPH_BASE: ${META_GRAPH_BASE_INTERNAL:-}
    volumes:
      # Source de vérité des Assets et Variants (section 5).
      #
      # Bind mount et non volume nommé: en développement le service web tourne
      # sur l'hôte, et un volume nommé lui rendrait les fichiers invisibles.
      # Le worker écrirait des dérivations que personne d'autre ne verrait.
      - ${MEDIA_HOST_PATH:-./media}:/media

volumes:
  postgres-data:
  postgres-temporal-data:
  minio-data:
